name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Verificar motor y controles offline
        run: |
          node --check app/src/main/assets/www/solo-engine.js
          node --check app/src/main/assets/www/ui.js
          node tests/offline.test.js
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar componentes Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar instalador
        run: gradle :app:assembleDebug --stacktrace
      - name: Validar que el instalador incluye el juego offline
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/www/(index.html|ui.js|solo-engine.js)'
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronicas-del-Abismo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
